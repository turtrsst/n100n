<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>n100n — local automation</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#262b36; --text:#e6e9ef; --muted:#8b93a7; --accent:#4f8cff; --ok:#39b87b; --err:#e0555f; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 system-ui,Segoe UI,sans-serif; background:var(--bg); color:var(--text); }
  button, input, select, textarea { font:inherit; color:inherit; background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:6px 9px; }
  button { cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.danger { color:var(--err); }
  textarea { width:100%; font-family:Consolas,monospace; font-size:12.5px; min-height:64px; resize:vertical; }
  .hidden { display:none !important; }
  #login { max-width:320px; margin:18vh auto; padding:22px; background:var(--panel); border:1px solid var(--line); border-radius:10px; display:flex; flex-direction:column; gap:10px; }
  #login h1 { margin:0 0 4px; font-size:17px; }
  #login small { color:var(--muted); }
  header { display:flex; align-items:center; gap:12px; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel); }
  header h1 { font-size:15px; margin:0; font-weight:600; }
  header .spacer { flex:1; }
  #app { display:grid; grid-template-columns:240px 1fr; height:calc(100vh - 49px); }
  aside { border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  aside .head { padding:10px; display:flex; gap:6px; }
  #list { overflow:auto; flex:1; }
  #list button { display:block; width:100%; text-align:left; border:0; border-radius:0; border-bottom:1px solid var(--line); padding:9px 12px; background:transparent; }
  #list button.active { background:#1d2330; box-shadow:inset 2px 0 var(--accent); }
  #list small { color:var(--muted); }
  main { overflow:auto; padding:16px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:10px; }
  .row > label { color:var(--muted); font-size:12px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px; margin-bottom:8px; }
  .card .node-head { display:flex; gap:6px; align-items:center; margin-bottom:6px; }
  .card .node-head select { width:130px; }
  .card .node-head input { flex:1; }
  .mini { padding:3px 7px; font-size:12px; }
  .hint { color:var(--muted); font-size:12px; margin:6px 0 12px; }
  .muted { color:var(--muted); }
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  th, td { text-align:left; padding:5px 8px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:500; }
  tbody tr { cursor:pointer; }
  tbody tr:hover { background:#1d2330; }
  .pill { border-radius:99px; padding:1px 8px; font-size:11px; }
  .pill.success { background:#123524; color:var(--ok); }
  .pill.error { background:#3a161a; color:var(--err); }
  .pill.running { background:#22283a; color:var(--accent); }
  pre { background:#0b0d11; border:1px solid var(--line); border-radius:6px; padding:10px; overflow:auto; max-height:340px; font-size:12px; }
  #toast { position:fixed; right:16px; bottom:16px; background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--accent); padding:9px 13px; border-radius:6px; display:none; }
  h2 { font-size:13px; color:var(--muted); font-weight:600; margin:18px 0 8px; text-transform:uppercase; letter-spacing:.04em; }
</style>
</head>
<body>

<div id="login">
  <h1>n100n</h1>
  <small>Local automation engine</small>
  <input id="pw" type="password" placeholder="Password admin" autofocus>
  <button class="primary" id="loginBtn">Masuk</button>
  <small id="loginErr" style="color:var(--err)"></small>
</div>

<div id="app" class="hidden">
  <aside>
    <div class="head">
      <button class="primary" id="newBtn" style="flex:1">+ Workflow</button>
    </div>
    <div id="list"></div>
  </aside>

  <main>
    <div class="row">
      <input id="wfName" placeholder="Nama workflow" style="flex:1; min-width:220px">
      <label><input type="checkbox" id="wfActive"> Aktif</label>
      <button class="primary" id="saveBtn">Simpan</button>
      <button id="runBtn">Run</button>
      <button class="danger" id="delBtn">Hapus</button>
    </div>

    <div class="row">
      <label>Trigger</label>
      <select id="wfTrigger">
        <option value="manual">manual</option>
        <option value="webhook">webhook</option>
        <option value="schedule">schedule</option>
      </select>
      <span id="triggerFields"></span>
      <label>Error workflow</label>
      <select id="wfError"><option value="">—</option></select>
    </div>

    <div class="hint">
      Template: <code>{{ $json.field }}</code> · <code>{{ $env.NAMA_ENV }}</code> · <code>{{ $now }}</code> · full-string <code>{{ }}</code> mengembalikan objek/array mentah
    </div>

    <h2>Nodes</h2>
    <div id="nodes"></div>
    <div class="row" style="margin-top:8px">
      <select id="addType"></select>
      <button id="addBtn">+ Node</button>
    </div>

    <h2>Run manual</h2>
    <textarea id="runInput">[{"hello":"world"}]</textarea>
    <pre id="runOut" class="hidden"></pre>

    <h2>Eksekusi terakhir</h2>
    <table><thead><tr><th>ID</th><th>Status</th><th>Trigger</th><th>Mulai</th><th>Error</th></tr></thead><tbody id="execs"></tbody></table>
    <pre id="execDetail" class="hidden"></pre>
  </main>
</div>

<div id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const TYPES = {
  manual: { name: 'Start', config: {} },
  webhook: { name: 'Webhook', config: {} },
  schedule: { name: 'Schedule', config: {} },
  set: { name: 'Set fields', config: { fields: {} } },
  if: { name: 'Filter', config: { condition: '$json.ok === true' } },
  code: { name: 'Code', config: { code: 'return items.map(i => i);' } },
  http: { name: 'HTTP request', config: { method: 'GET', url: 'https://httpbin.org/json', headers: {}, each: false } },
  telegram: { name: 'Telegram', config: { text: 'Hello {{ $json.hello }}', parse_mode: '' } },
  file: { name: 'File', config: { action: 'write', path: 'C:\\\\xampp\\\\htdocs\\\\n100n\\\\files\\\\out.txt', content: '{{ $json }}' } },
  delay: { name: 'Delay', config: { ms: 1000 } },
  workflow: { name: 'Sub-workflow', config: { workflow_id: 1 } },
  respond: { name: 'Respond', config: { status: 200, body: { ok: true } } },
  stop: { name: 'Stop', config: {} }
};

let state = { wf: null, list: [], workflows: [] };

function toast(msg, ms = 2200) {
  $('toast').textContent = msg;
  $('toast').style.display = 'block';
  clearTimeout(toast.t);
  toast.t = setTimeout(() => ($('toast').style.display = 'none'), ms);
}

async function api(method, url, body) {
  const opts = { method, headers: {} };
  if (body !== undefined) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  const res = await fetch(url, opts);
  if (res.status === 401) { showLogin(); throw new Error('unauthorized'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.status);
  return data;
}

function showLogin() { $('login').classList.remove('hidden'); $('app').classList.add('hidden'); }
function showApp() { $('login').classList.add('hidden'); $('app').classList.remove('hidden'); }

$('loginBtn').onclick = async () => {
  try {
    await api('POST', '/api/login', { password: $('pw').value });
    showApp(); await boot();
  } catch (e) { $('loginErr').textContent = e.message; }
};
$('pw').onkeydown = (e) => { if (e.key === 'Enter') $('loginBtn').click(); };

async function boot() {
  $('addType').innerHTML = Object.keys(TYPES).map((t) => `<option value="${t}">${t}</option>`).join('');
  state.workflows = await api('GET', '/api/workflows');
  renderList();
  if (state.workflows[0]) await open(state.workflows[0].id);
}

function renderList() {
  $('list').innerHTML = '';
  state.workflows.forEach((w) => {
    const b = document.createElement('button');
    b.innerHTML = `${w.name}<br><small>#${w.id} · ${w.trigger} · ${w.active ? 'aktif' : 'nonaktif'}</small>`;
    if (state.wf && state.wf.id === w.id) b.classList.add('active');
    b.onclick = () => open(w.id);
    $('list').appendChild(b);
  });
  const opts = ['<option value="">—</option>'].concat(
    state.workflows.map((w) => `<option value="${w.id}">#${w.id} ${w.name}</option>`)
  );
  const current = (state.wf && state.wf.error_workflow_id) || '';
  $('wfError').innerHTML = opts.join('');
  if (current) $('wfError').value = current;
}

async function open(id) {
  state.wf = await api('GET', '/api/workflows/' + id);
  renderEditor();
  renderList();
  loadExecs();
}

function renderEditor() {
  const wf = state.wf;
  $('wfName').value = wf.name;
  $('wfActive').checked = !!wf.active;
  $('wfTrigger').value = wf.trigger;
  $('wfError').value = wf.error_workflow_id || '';
  renderTriggerFields();
  renderNodes();
}

function renderTriggerFields() {
  const t = $('wfTrigger').value;
  const cfg = (state.wf && state.wf.trigger_cfg) || {};
  if (t === 'webhook') {
    $('triggerFields').innerHTML = `path <input id="cbPath" value="${esc(cfg.path || 'kra')}" style="width:150px">
      method <select id="cbMethod">${['any','POST','GET','PUT'].map((m) => `<option ${cfg.method === m ? 'selected' : ''}>${m}</option>`).join('')}</select>`;
  } else if (t === 'schedule') {
    $('triggerFields').innerHTML = `setiap <input id="cbEvery" type="number" min="1" value="${cfg.every_minutes || 15}" style="width:70px"> menit`;
  } else {
    $('triggerFields').innerHTML = '';
  }
}

$('wfTrigger').onchange = () => { renderTriggerFields(); };

function esc(s) { return String(s).replace(/"/g, '&quot;'); }

function renderNodes() {
  const wrap = $('nodes');
  wrap.innerHTML = '';
  state.wf.nodes.forEach((node, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="node-head">
        <span class="muted">${i + 1}</span>
        <select data-f="type">${Object.keys(TYPES).map((t) => `<option ${t === node.type ? 'selected' : ''}>${t}</option>`).join('')}</select>
        <input data-f="name" value="${esc(node.name || '')}" placeholder="nama node">
        <button class="mini" data-a="up" title="naik">↑</button>
        <button class="mini" data-a="down" title="turun">↓</button>
        <button class="mini danger" data-a="del" title="hapus">✕</button>
      </div>
      <textarea spellcheck="false" data-f="config">${esc(JSON.stringify(node.config || {}, null, 2))}</textarea>`;
    card.querySelector('[data-f=type]').onchange = (e) => {
      node.type = e.target.value;
      if (TYPES[node.type] && !Object.keys(node.config || {}).length) node.config = JSON.parse(JSON.stringify(TYPES[node.type].config));
      renderNodes();
    };
    card.querySelector('[data-f=name]').oninput = (e) => (node.name = e.target.value);
    card.querySelector('[data-f=config]').onchange = (e) => {
      try {
        node.config = JSON.parse(e.target.value);
        e.target.style.borderColor = '';
      } catch {
        e.target.style.borderColor = 'var(--err)';
        toast('JSON config tidak valid');
      }
    };
    card.querySelector('[data-a=up]').onclick = () => { if (i > 0) { state.wf.nodes.splice(i - 1, 0, state.wf.nodes.splice(i, 1)[0]); renderNodes(); } };
    card.querySelector('[data-a=down]').onclick = () => { if (i < state.wf.nodes.length - 1) { state.wf.nodes.splice(i + 1, 0, state.wf.nodes.splice(i, 1)[0]); renderNodes(); } };
    card.querySelector('[data-a=del]').onclick = () => { state.wf.nodes.splice(i, 1); renderNodes(); };
    wrap.appendChild(card);
  });
}

$('addBtn').onclick = () => {
  const t = $('addType').value;
  state.wf.nodes.push({ type: t, name: TYPES[t].name, config: JSON.parse(JSON.stringify(TYPES[t].config)) });
  renderNodes();
};

$('newBtn').onclick = async () => {
  const wf = await api('POST', '/api/workflows', { name: 'Workflow baru' });
  state.workflows.push(wf);
  renderList();
  await open(wf.id);
};

$('saveBtn').onclick = async () => {
  const t = $('wfTrigger').value;
  const trigger_cfg = {};
  if (t === 'webhook') { trigger_cfg.path = $('cbPath').value.trim(); trigger_cfg.method = $('cbMethod').value; }
  if (t === 'schedule') trigger_cfg.every_minutes = Number($('cbEvery').value || 15);
  try {
    state.wf = await api('PUT', '/api/workflows/' + state.wf.id, {
      name: $('wfName').value,
      active: $('wfActive').checked,
      trigger: t,
      trigger_cfg,
      nodes: state.wf.nodes,
      error_workflow_id: $('wfError').value ? Number($('wfError').value) : null
    });
    state.workflows = await api('GET', '/api/workflows');
    renderList(); renderTriggerFields();
    toast('Tersimpan');
  } catch (e) { toast('Gagal simpan: ' + e.message); }
};

$('delBtn').onclick = async () => {
  if (!state.wf || !confirm('Hapus workflow #' + state.wf.id + '?')) return;
  await api('DELETE', '/api/workflows/' + state.wf.id);
  state.workflows = await api('GET', '/api/workflows');
  state.wf = { id: 0, nodes: [] };
  renderList();
  if (state.workflows[0]) await open(state.workflows[0].id);
  else { $('nodes').innerHTML = ''; $('execs').innerHTML = ''; }
};

$('runBtn').onclick = async () => {
  if (!state.wf) return;
  let input;
  try { input = JSON.parse($('runInput').value || '[{}]'); } catch { return toast('Input JSON tidak valid'); }
  $('runOut').classList.remove('hidden');
  $('runOut').textContent = 'running...';
  try {
    const res = await api('POST', `/api/workflows/${state.wf.id}/run`, { items: input });
    $('runOut').textContent = JSON.stringify(res, null, 2);
    loadExecs();
  } catch (e) {
    $('runOut').textContent = 'ERROR: ' + e.message;
    loadExecs();
  }
};

async function loadExecs() {
  if (!state.wf || !state.wf.id) return;
  const rows = await api('GET', '/api/executions?workflow_id=' + state.wf.id);
  $('execs').innerHTML = rows.map((r) => `<tr data-id="${r.id}">
      <td>${r.id}</td>
      <td><span class="pill ${r.status}">${r.status}</span></td>
      <td>${r.trigger || ''}</td>
      <td class="muted">${r.started || ''}</td>
      <td class="muted">${r.error ? String(r.error).slice(0, 80) : ''}</td>
    </tr>`).join('');
  [...$('execs').querySelectorAll('tr')].forEach((tr) => {
    tr.onclick = async () => {
      const detail = await api('GET', '/api/executions/' + tr.dataset.id);
      const d = $('execDetail');
      d.classList.remove('hidden');
      d.textContent = JSON.stringify({
        id: detail.id, status: detail.status, started: detail.started, finished: detail.finished,
        error: detail.error, log: detail.log,
        input: safeParse(detail.input), output: safeParse(detail.output)
      }, null, 2);
    };
  });
}

function safeParse(s) { try { return JSON.parse(s); } catch { return s; } }

(async () => {
  try { await api('GET', '/api/session'); showApp(); await boot(); } catch { showLogin(); }
})();
</script>
</body>
</html>
